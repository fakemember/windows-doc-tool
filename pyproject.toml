[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tflow"
version = "0.2.0"
description = "TFLOW - Clinical TFL & Document Pipeline with native dynamic TOC injection (pure Microsoft Word COM engine)"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
tflow = "wdt.main:main"
wdt = "wdt.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
